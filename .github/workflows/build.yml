name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Kernel Job
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev bzip2 git bison flex libssl-dev libelf-dev bc ccache zip curl wget python3 lz4 liblz4-tool u-boot-tools patch libarchive-tools zstd rsync cpio kmod openssl pahole libtinfo5 || true

      - name: Download Toolchains (ravindu644 recommended)
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchains && cd $GITHUB_WORKSPACE/toolchains

          echo "[+] Downloading clang-r383902b (ravindu644 recommended for Linux 4.14)..."
          wget -c --tries=5 --timeout=30 https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902b.tar.gz
          mkdir -p clang && tar -xf clang-r383902b.tar.gz -C clang && rm -f clang-r383902b.tar.gz

          echo "[+] Downloading ARM GNU Toolchain (cross compiler)..."
          wget -c --tries=5 --timeout=30 https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          mkdir -p gcc-arm && tar -xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -C gcc-arm --strip-components=1 && rm -f arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz

          echo "[+] Toolchains ready."
          ls -la clang/bin/ | head -5
          ls -la gcc-arm/bin/ | head -5

      - name: Clone Kernel Source (ravindu644 Exynos9820)
        run: |
          cd $GITHUB_WORKSPACE
          echo "[+] Trying lineage-23.2 (Android 16) first..."
          git clone --depth=1 -b lineage-23.2 https://github.com/ravindu644/android_kernel_aosp_exynos9820.git kernel 2>/dev/null || {
            echo "[!] lineage-23.2 not found, falling back to lineage-22.1 (Android 15)..."
            git clone --depth=1 -b lineage-22.1 https://github.com/ravindu644/android_kernel_aosp_exynos9820.git kernel
          }
          echo "[+] Kernel source cloned. Branch:"
          cd kernel && git branch -a && head -5 Makefile

      - name: Integrate SukiSU-Ultra
        run: |
          cd kernel
          echo "[+] Integrating SukiSU-Ultra (susfs_new branch)..."
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs_new
          echo "[+] Patching SukiSU for 4.14 compatibility (missing types in Samsung kernel)..."
          sed -i '1i #include <linux/syscalls.h>\n#include <asm/syscall.h>\nstruct pt_regs;\n#ifndef syscall_fn_t\ntypedef long (*syscall_fn_t)(struct pt_regs *);\n#endif' drivers/kernelsu/hook/syscall_hook.h || true
          sed -i '1i #ifndef MODULE_IMPORT_NS\n#define MODULE_IMPORT_NS(ns)\n#endif' drivers/kernelsu/core/init.c || true
          echo "#include <asm/pgtable.h>" > include/linux/pgtable.h
          echo "[+] Patching lsm_hook.c for 4.14 compatibility (hlist -> list)..."
          sed -i 's/hlist_for_each_entry/list_for_each_entry/g' drivers/kernelsu/hook/lsm_hook.c || true
          sed -i 's/hlist_entry/list_entry/g' drivers/kernelsu/hook/lsm_hook.c || true
          sed -i 's/hlist_node/list_head/g' drivers/kernelsu/hook/lsm_hook.c || true
          sed -i 's/hlist_head/list_head/g' drivers/kernelsu/hook/lsm_hook.c || true
          sed -i 's/->first/->next/g' drivers/kernelsu/hook/lsm_hook.c || true
          sed -i 's/\.pprev = .*/\.prev = head;/g' drivers/kernelsu/hook/lsm_hook.c || true
          echo "[+] Patching patch_memory.c for 4.14 compatibility..."
          sed -i 's/__flush_icache_range/flush_icache_range/g' drivers/kernelsu/hook/arm64/patch_memory.c || true
          echo "[+] Stubbing file_wrapper.c for 4.14 compatibility (feature disabled)..."
          echo "int ksu_install_file_wrapper(int fd) { return 0; }" > drivers/kernelsu/infra/file_wrapper.c
          echo "void ksu_file_wrapper_init(void) {}" >> drivers/kernelsu/infra/file_wrapper.c
          echo "[+] Patching event_queue for 4.14 compatibility (__poll_t and EPOLL)..."
          find drivers/kernelsu/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/__poll_t/unsigned int/g' {} + || true
          sed -i 's/EPOLLHUP/POLLHUP/g' drivers/kernelsu/infra/event_queue.c || true
          sed -i 's/EPOLLIN/POLLIN/g' drivers/kernelsu/infra/event_queue.c || true
          sed -i 's/EPOLLRDNORM/POLLRDNORM/g' drivers/kernelsu/infra/event_queue.c || true
          sed -i 's/EPOLLERR/POLLERR/g' drivers/kernelsu/infra/event_queue.c || true
          echo "[+] Patching seccomp_cache.c for 4.14 compatibility..."
          sed -i '1s/^/#ifndef SECCOMP_ARCH_NATIVE_NR\n#define SECCOMP_ARCH_NATIVE_NR 1024\n#endif\n/' drivers/kernelsu/infra/seccomp_cache.c || true
          echo "[+] Patching su_mount_ns.c for 4.14 compatibility..."
          sed -i 's/<uapi\/linux\/mount.h>/<linux\/mount.h>/g' drivers/kernelsu/infra/su_mount_ns.c || true
          echo "[+] Stubbing pkg_observer.c for 4.14 compatibility (feature disabled)..."
          echo "int ksu_observer_init(void) { return 0; }" > drivers/kernelsu/manager/pkg_observer.c
          echo "void ksu_observer_exit(void) {}" >> drivers/kernelsu/manager/pkg_observer.c
          echo "[+] Patching TWA_RESUME and fallthrough for 4.14 compatibility..."
          find drivers/kernelsu/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/TWA_RESUME/true/g' {} + || true
          find drivers/kernelsu/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/fallthrough;/\/\* fallthrough \*\//g' {} + || true
          echo "[+] Patching app_profile.c for 4.14 compatibility..."
          sed -i '/seccomp.filter_count/d' drivers/kernelsu/policy/app_profile.c || true
          echo "[+] Stubbing rules.c for 4.14 compatibility (SELinux rules disabled)..."
          echo "#include <linux/types.h>" > drivers/kernelsu/selinux/rules.c
          echo "#include <linux/compiler.h>" >> drivers/kernelsu/selinux/rules.c
          echo "void apply_kernelsu_rules(void) {}" >> drivers/kernelsu/selinux/rules.c
          echo "int handle_sepolicy(void __user *user_data, u64 data_len) { return 0; }" >> drivers/kernelsu/selinux/rules.c
          echo "[+] Creating ksu_hook.h for ravindu644 kernel tree compatibility..."
          cp drivers/kernelsu/include/*.h include/linux/ || true
          cp drivers/kernelsu/include/*.h include/ || true
          echo "#include <linux/ksu.h>" > include/ksu_hook.h
          echo "#include <linux/ksu.h>" > include/linux/ksu_hook.h
          echo "[+] Integration done. (SuSFS is natively bundled)"

      - name: Update Defconfig
        run: |
          echo "CONFIG_KSU=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_SU=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSYM=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_CC_STACKPROTECTOR=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc-arm/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out exynos9820-beyondx_defconfig

          make -j$(nproc) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            KCFLAGS="-w -Wno-error -march=armv8-a+lse"

      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          if [ -f "kernel/out/arch/arm64/boot/Image.lz4" ]; then
            cp kernel/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          elif [ -f "kernel/out/arch/arm64/boot/Image" ]; then
            cp kernel/out/arch/arm64/boot/Image AK3/Image
          fi
          sed -i 's/device.name1=.*/device.name1=beyondx/g' AK3/anykernel.sh || true
          sed -i 's/device.name2=.*/device.name2=beyondxks/g' AK3/anykernel.sh || true
          cd AK3
          zip -r9 ../KernelSU-Next-SUSFS-S10-5G-beyondx.zip * -x .git\* README.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-SUSFS-S10-5G-beyondx
          path: KernelSU-Next-SUSFS-S10-5G-beyondx.zip
