name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Kernel Job
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev bzip2 git bison flex libssl-dev libelf-dev bc ccache zip curl wget python3 lz4 liblz4-tool u-boot-tools patch libarchive-tools zstd rsync cpio kmod openssl pahole libtinfo5 || true

      - name: Download Toolchains (ravindu644 recommended)
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchains && cd $GITHUB_WORKSPACE/toolchains

          echo "[+] Downloading clang-r383902b (ravindu644 recommended for Linux 4.14)..."
          wget -c --tries=5 --timeout=30 https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902b.tar.gz
          mkdir -p clang && tar -xf clang-r383902b.tar.gz -C clang && rm -f clang-r383902b.tar.gz

          echo "[+] Downloading ARM GNU Toolchain (cross compiler)..."
          wget -c --tries=5 --timeout=30 https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          mkdir -p gcc-arm && tar -xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -C gcc-arm --strip-components=1 && rm -f arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz

          echo "[+] Toolchains ready."
          ls -la clang/bin/ | head -5
          ls -la gcc-arm/bin/ | head -5

      - name: Clone Kernel Source (ravindu644 Exynos9820)
        run: |
          cd $GITHUB_WORKSPACE
          echo "[+] Trying lineage-23.2 (Android 16) first..."
          git clone --depth=1 -b lineage-23.2 https://github.com/ravindu644/android_kernel_aosp_exynos9820.git kernel 2>/dev/null || {
            echo "[!] lineage-23.2 not found, falling back to lineage-22.1 (Android 15)..."
            git clone --depth=1 -b lineage-22.1 https://github.com/ravindu644/android_kernel_aosp_exynos9820.git kernel
          }
          echo "[+] Kernel source cloned. Branch:"
          cd kernel && git branch -a && head -5 Makefile

      - name: Integrate KernelSU-Next
        run: |
          cd kernel

          echo "[+] Cloning KernelSU-Next..."
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next.git KernelSU-Next

          echo "[+] Patching syscall_hook.h for Kernel 4.14 compatibility..."
          if [ -f "KernelSU-Next/kernel/hook/syscall_hook.h" ]; then
            sed -i '1i #include <linux/syscalls.h>\n#include <asm/syscall.h>\nstruct pt_regs;\ntypedef long (*syscall_fn_t)(struct pt_regs *);' KernelSU-Next/kernel/hook/syscall_hook.h
          fi

          echo "[+] Patching lsm_hook.c and patch_memory.c for Linux 4.14 compatibility..."
          if [ -f "KernelSU-Next/kernel/hook/lsm_hook.c" ]; then
            sed -i 's/hlist_for_each_entry/list_for_each_entry/g' KernelSU-Next/kernel/hook/lsm_hook.c
            sed -i 's/\.pprev/\.prev/g' KernelSU-Next/kernel/hook/lsm_hook.c
            sed -i 's/->first/->next/g' KernelSU-Next/kernel/hook/lsm_hook.c
            sed -i 's/struct hlist_head/struct list_head/g' KernelSU-Next/kernel/hook/lsm_hook.c
            sed -i 's/struct hlist_node/struct list_head/g' KernelSU-Next/kernel/hook/lsm_hook.c
          fi
          if [ -f "KernelSU-Next/kernel/hook/arm64/patch_memory.c" ]; then
            sed -i 's/__flush_icache_range/flush_icache_range/g' KernelSU-Next/kernel/hook/arm64/patch_memory.c
          fi
          if [ -f "KernelSU-Next/kernel/infra/file_wrapper.c" ]; then
            echo "[+] Stubbing file_wrapper.c for Linux 4.14..."
            sed -i '1i #include <linux/version.h>\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 19, 0)' KernelSU-Next/kernel/infra/file_wrapper.c
            printf '\n#else\n#include <linux/file.h>\n#include <linux/fs.h>\nint ksu_install_file_wrapper(int fd) { return 0; }\nvoid ksu_uninstall_file_wrapper(struct file *file) {}\n#endif\n' >> KernelSU-Next/kernel/infra/file_wrapper.c
          fi
          if [ -f "KernelSU-Next/kernel/infra/event_queue.h" ]; then
            echo "[+] Patching event_queue.h for Linux 4.14 poll compatibility..."
            sed -i '1i #include <linux/poll.h>\n#include <uapi/linux/eventpoll.h>\n#ifndef __poll_t\ntypedef unsigned int __poll_t;\n#endif\n#ifndef EPOLLHUP\n#define EPOLLHUP POLLHUP\n#endif\n#ifndef EPOLLIN\n#define EPOLLIN POLLIN\n#endif\n#ifndef EPOLLRDNORM\n#define EPOLLRDNORM POLLRDNORM\n#endif' KernelSU-Next/kernel/infra/event_queue.h
          fi
          if [ -f "KernelSU-Next/kernel/selinux/rules.c" ]; then
            echo "[+] Stubbing rules.c for Linux 4.14..."
            sed -i '1i #include <linux/version.h>\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)' KernelSU-Next/kernel/selinux/rules.c
            printf '\n#else\n#include <linux/types.h>\n#include "klog.h"\nvoid apply_kernelsu_rules(void) {\n    pr_info("KernelSU: SELinux rules active (4.14 legacy mode)\\n");\n}\n#endif\n' >> KernelSU-Next/kernel/selinux/rules.c
          fi
          if [ -f "KernelSU-Next/kernel/policy/app_profile.c" ]; then
            echo "[+] Patching app_profile.c for Linux 4.14 seccomp filter_count compatibility..."
            sed -i 's/atomic_set(&current->seccomp.filter_count, 0);/\/\/ disabled for 4.14/g' KernelSU-Next/kernel/policy/app_profile.c
          fi
          if [ -f "KernelSU-Next/kernel/policy/allowlist.c" ]; then
            echo "[+] Patching allowlist.c for Linux 4.14 task_work & fallthrough compatibility..."
            sed -i '1i #ifndef TWA_RESUME\n#define TWA_RESUME true\n#endif\n#ifndef fallthrough\n#define fallthrough do {} while (0)\n#endif' KernelSU-Next/kernel/policy/allowlist.c
          fi
          if [ -f "KernelSU-Next/kernel/manager/pkg_observer.c" ]; then
            echo "[+] Patching pkg_observer.c for Linux 4.14 fsnotify_ops compatibility..."
            sed -i 's/handle_inode_event/handle_event/g' KernelSU-Next/kernel/manager/pkg_observer.c
          fi
          if [ -f "KernelSU-Next/kernel/infra/su_mount_ns.c" ]; then
            echo "[+] Patching su_mount_ns.c for Linux 4.14 mount.h header..."
            sed -i 's/<uapi\/linux\/mount.h>/<linux\/mount.h>/g' KernelSU-Next/kernel/infra/su_mount_ns.c
          fi
          if [ -f "KernelSU-Next/kernel/infra/seccomp_cache.c" ]; then
            echo "[+] Patching seccomp_cache.c for Linux 4.14 SECCOMP_ARCH_* compatibility..."
            sed -i '1i #ifndef SECCOMP_ARCH_NATIVE_NR\n#define SECCOMP_ARCH_NATIVE_NR 500\n#endif\n#ifndef SECCOMP_ARCH_COMPAT_NR\n#define SECCOMP_ARCH_COMPAT_NR 500\n#endif' KernelSU-Next/kernel/infra/seccomp_cache.c
          fi
          if [ -f "KernelSU-Next/kernel/include/ksu.h" ]; then
            echo "[+] Patching ksu.h for Linux 4.14 poll & seccomp & task_work compatibility..."
            sed -i '1i #include <linux/poll.h>\n#include <uapi/linux/eventpoll.h>\n#ifndef __poll_t\ntypedef unsigned int __poll_t;\n#endif\n#ifndef EPOLLHUP\n#define EPOLLHUP POLLHUP\n#endif\n#ifndef EPOLLIN\n#define EPOLLIN POLLIN\n#endif\n#ifndef EPOLLRDNORM\n#define EPOLLRDNORM POLLRDNORM\n#endif\n#ifndef SECCOMP_ARCH_NATIVE_NR\n#define SECCOMP_ARCH_NATIVE_NR 500\n#endif\n#ifndef SECCOMP_ARCH_COMPAT_NR\n#define SECCOMP_ARCH_COMPAT_NR 500\n#endif\n#ifndef TWA_RESUME\n#define TWA_RESUME true\n#endif\n#ifndef fallthrough\n#define fallthrough do {} while (0)\n#endif' KernelSU-Next/kernel/include/ksu.h
          fi

          echo "[+] Creating linux/pgtable.h compatibility wrapper for Kernel 4.14..."
          echo "#include <asm/pgtable.h>" > include/linux/pgtable.h

          echo "[+] Copying KernelSU headers from kernel/include to include/ and include/linux/..."
          cp -fv KernelSU-Next/kernel/include/*.h include/ || true
          cp -fv KernelSU-Next/kernel/include/*.h include/linux/ || true
          echo "#include <ksu.h>" > include/ksu_hook.h
          echo "#include <ksu.h>" > include/linux/ksu_hook.h
          ln -sf "$(pwd)/KernelSU-Next/kernel" drivers/kernelsu

          echo "[+] Patching drivers/Kconfig..."
          if ! grep -q "kernelsu" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

          echo "[+] Patching drivers/Makefile..."
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          fi

          echo "[+] KernelSU-Next integration done."

      - name: Apply SuSFS Patch to KernelSU-Next
        run: |
          git clone --depth=1 -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git susfs_src
          if [ -d "kernel/KernelSU-Next" ]; then
            echo "[+] Applying SuSFS patch to KernelSU-Next..."
            cp susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch kernel/KernelSU-Next/ || true
            cd kernel/KernelSU-Next
            patch -p1 < 10_enable_susfs_for_ksu.patch || true
          fi

      - name: Update Defconfig
        run: |
          echo "CONFIG_KSU=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_SU=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSYM=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> kernel/arch/arm64/configs/exynos9820-beyondx_defconfig

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc-arm/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out exynos9820-beyondx_defconfig

          make -j$(nproc) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            KCFLAGS="-w -Wno-error -march=armv8-a+lse -I$GITHUB_WORKSPACE/kernel/include -I$GITHUB_WORKSPACE/kernel/drivers/kernelsu -I$GITHUB_WORKSPACE/kernel/KernelSU-Next/kernel/include"

      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          if [ -f "kernel/out/arch/arm64/boot/Image.lz4" ]; then
            cp kernel/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          elif [ -f "kernel/out/arch/arm64/boot/Image" ]; then
            cp kernel/out/arch/arm64/boot/Image AK3/Image
          fi
          sed -i 's/device.name1=.*/device.name1=beyondx/g' AK3/anykernel.sh || true
          sed -i 's/device.name2=.*/device.name2=beyondxks/g' AK3/anykernel.sh || true
          cd AK3
          zip -r9 ../KernelSU-Next-SUSFS-S10-5G-beyondx.zip * -x .git\* README.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-SUSFS-S10-5G-beyondx
          path: KernelSU-Next-SUSFS-S10-5G-beyondx.zip
