name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Kernel Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev bzip2 libbcc-dev git bison flex libssl-dev libelf-dev bc ccache zip curl wget python3 libtinfo5 lz4 liblz4-tool u-boot-tools patch

      - name: Download Toolchains
        run: |
          mkdir -p toolchains
          cd toolchains
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r416183b.tar.gz
          mkdir -p clang
          tar -xf clang-r416183b.tar.gz -C clang
          rm -f clang-r416183b.tar.gz
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b lineage-22.1 https://github.com/ravindu644/android_kernel_aosp_exynos9820.git kernel

      - name: Integrate KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/rifs28/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Apply SuSFS Patches
        run: |
          git clone --depth=1 -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git susfs_src
          cd kernel
          cp ../susfs_src/kernel_patches/fs/susfs.c fs/
          cp ../susfs_src/kernel_patches/include/linux/susfs.h include/linux/
          cp ../susfs_src/kernel_patches/include/linux/sus_su.h include/linux/
          if [ -d "KernelSU-Next" ]; then
            cp ../susfs_src/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU-Next/ || true
            cd KernelSU-Next
            patch -p1 < 10_enable_susfs_for_ksu.patch || true
            cd ..
          fi
          patch -p1 < ../susfs_src/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true

      - name: Update Defconfig
        run: |
          echo "CONFIG_KSU=y" >> kernel/arch/arm64/configs/exynos9820_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> kernel/arch/arm64/configs/exynos9820_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_SU=y" >> kernel/arch/arm64/configs/exynos9820_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> kernel/arch/arm64/configs/exynos9820_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> kernel/arch/arm64/configs/exynos9820_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSYM=y" >> kernel/arch/arm64/configs/exynos9820_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> kernel/arch/arm64/configs/exynos9820_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> kernel/arch/arm64/configs/exynos9820_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> kernel/arch/arm64/configs/exynos9820_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> kernel/arch/arm64/configs/exynos9820_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> kernel/arch/arm64/configs/exynos9820_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> kernel/arch/arm64/configs/exynos9820_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> kernel/arch/arm64/configs/exynos9820_defconfig

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out exynos9820_defconfig
          make -j$(nproc) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          if [ -f "kernel/out/arch/arm64/boot/Image.lz4" ]; then
            cp kernel/out/arch/arm64/boot/Image.lz4 AK3/Image.lz4
          elif [ -f "kernel/out/arch/arm64/boot/Image" ]; then
            cp kernel/out/arch/arm64/boot/Image AK3/Image
          fi
          sed -i 's/device.name1=.*/device.name1=beyondx/g' AK3/anykernel.sh || true
          sed -i 's/device.name2=.*/device.name2=beyondxks/g' AK3/anykernel.sh || true
          cd AK3
          zip -r9 ../KernelSU-Next-SUSFS-S10-5G-beyondx.zip * -x .git\* README.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-SUSFS-S10-5G-beyondx
          path: KernelSU-Next-SUSFS-S10-5G-beyondx.zip
